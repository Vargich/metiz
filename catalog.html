<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог — Метиз Электрод</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css" />
  <meta name="format-detection" content="telephone=no">
</head>
<body>

  <!-- ШАПКА -->
  <header class="shop-header">
    <div class="shop-header__container">
      <a href="/" class="shop-logo">Метиз<span class="text-brand">Электрод</span></a>
      
      <nav class="shop-nav">
        <a href="/">Главная</a>
        <a href="/catalog" class="active">Каталог</a>
        <a href="/about">О нас</a>
        <a href="/contacts">Контакты</a>
      </nav>
      
      <div class="shop-header__actions">
        <a href="tel:+78445790099" class="hero-btn" style="padding: 10px 20px; font-size: 11px; white-space: nowrap;">
          <i class="fas fa-phone-alt" style="margin-right: 8px;"></i>+7 (84457) 9-00-99
        </a>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="catalog-layout">
      <!-- БОКОВОЙ САЙДБАР (Фильтры) -->
      <aside class="catalog-sidebar" id="catalogSidebar">
        <!-- Кнопка закрытия шторки на мобильных -->
        <button class="sidebar-close-btn" onclick="toggleSidebar()">&times;</button>
        
        <!-- Блок 1: Поиск -->
        <div class="sidebar-block">
          <h3 class="sidebar-title">Поиск</h3>
          <div class="search-wrapper" style="min-width: 100%;">
            <input type="text" id="searchInput" placeholder="ПОИСК ПО НАЗВАНИЮ..." class="search-input">
            <i class="fas fa-search search-icon"></i>
          </div>
        </div>

        <!-- Блок 2: Выбор категории -->
        <div class="sidebar-block" style="border-bottom: none;">
          <h3 class="sidebar-title">Категория</h3>
          <div id="filters"></div> <!-- Сюда динамически вставится select из js -->
        </div>
      </aside>

      <!-- ТЕМНАЯ ПОДЛОЖКА ДЛЯ МОБИЛЬНЫХ (Затемнение при выезде шторки) -->
      <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

      <!-- ОСНОВНОЙ КОНТЕНТ (Сетка товаров) -->
      <div class="catalog-content">
        <!-- Кнопка открытия фильтров на мобильных (скрыта на десктопе) -->
        <div class="mobile-filter-bar">
          <button class="hero-btn mobile-filter-btn" onclick="toggleSidebar()">
            <i class="fas fa-sliders-h"></i> Показать фильтры
          </button>
        </div>

        <!-- Сетка товаров -->
        <div class="products-grid" id="productsGrid">
          <!-- Товары загрузятся сюда -->
        </div>
      </div>
    </section>
  </main>
  
  <!-- ФУТЕР -->
  <footer style="border-top:1px solid var(--dark);">
    <div class="footer-bottom">
      <div class="footer-copy">© <span id="current-year"></span> ИП Варгич В.Л.</div>
      
      <div class="footer-links">
        <a href="/admin-login">Админ-панель</a>
        <a href="#">Политика</a>
        <a href="#">Условия</a>
      </div>
      
      <div class="footer-socials">
        <a href="https://vk.com/metizelektrod" target="_blank" class="social-btn" style="text-decoration: none; color: inherit;">VK</a>
        <a href="https://t.me/metizelektrod" target="_blank" class="social-btn" style="text-decoration: none; color: inherit;">TG</a>
      </div>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script>
    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
