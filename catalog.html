<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог — Метиз Электрод</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css" />
  <meta name="format-detection" content="telephone=no">
</head>

<body>

<!-- ШАПКА -->
<header class="shop-header">
  <div class="shop-header__container">
    <a href="/" class="shop-logo">Метиз<span class="text-brand">Электрод</span></a>
    
    <!-- Телефон по центру (виден на всех экранах) -->
    <a href="tel:+78445790099" class="header-phone-btn header-phone-mobile">
      <i class="fas fa-phone-alt"></i>
      <span>+7 (84457) 9-00-99</span>
    </a>
    
    <!-- Кнопка бургер-меню справа -->
    <button class="burger-btn" id="burgerBtn" aria-label="Открыть меню">
      <span></span>
      <span></span>
      <span></span>
    </button>
    
    <nav class="shop-nav" id="shopNav">
      <a href="/" >Главная</a>
      <a href="/catalog" class="active">Каталог</a>
      <a href="/about">О нас</a>
      <a href="/contacts">Контакты</a>
    </nav>
    
    <!-- Десктопная версия телефона (скрывается на мобильных) -->
    <div class="shop-header__actions">
      <a href="tel:+78445790099" class="header-phone-btn header-phone-desktop">
        <i class="fas fa-phone-alt" style="margin-right: 6px;"></i><span>+7 (84457) 9-00-99</span>
      </a>
    </div>
  </div>
</header>

  <main id="main-content">
    <section class="catalog-layout">
      <div class="catalog-content">
        <!-- Верхняя панель -->
        <div class="catalog-top-panel">
          <!-- Поиск -->
          <div class="search-wrapper-top">
            <input type="text" id="searchInput" placeholder="Поиск по наименованию, ГОСТу или артикулу..."
              class="search-input-top">
            <button class="search-btn-top"><i class="fas fa-search"></i> Найти</button>
          </div>

          <!-- Фильтры -->
          <!-- Ряд фильтрации и сортировки -->
          <div class="filter-controls-row">
            <div class="filter-group">
              <span class="filter-label-top">Категория</span>
              <div class="custom-hover-select" id="categoryHoverSelect">
                <button class="hover-select-btn" id="categorySelectBtn">
                  <span id="selectedCategoryName">Все товары</span>
                  <i class="fas fa-chevron-down"></i>
                </button>
                <div class="hover-select-dropdown" id="categoryDropdown">
                  <!-- Категории загрузятся через JS -->
                </div>
              </div>
            </div>

            <div class="filter-group">
              <span class="filter-label-top">Сортировка</span>
              <select id="sortSelect" class="sort-select-top">
                <option value="default">По умолчанию</option>
                <option value="name">По алфавиту (А-Я)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Сетка товаров -->
        <div class="products-grid" id="productsGrid">
          <!-- Скелетоны -->
          <div class="skeleton-card">
            <div class="skeleton-box" style="aspect-ratio: 1/1; width: 100%;"></div>
            <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">
              <div class="skeleton-box" style="height: 14px; width: 85%;"></div>
              <div class="skeleton-box" style="height: 14px; width: 60%;"></div>
              <div class="skeleton-box" style="height: 10px; width: 35%; margin-top: auto;"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-box" style="aspect-ratio: 1/1; width: 100%;"></div>
            <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">

            <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">

              <div class="skeleton-box" style="height: 10px; width: 35%; margin-top: auto;"></div>

              <div class="skeleton-box" style="height: 14px; width: 85%;"></div>
              <div class="skeleton-box" style="height: 14px; width: 60%;"></div>
              <div class="skeleton-box" style="height: 10px; width: 35%; margin-top: auto;"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ФУТЕР -->
  <footer style="border-top:1px solid var(--border-color);">
    <div class="footer-bottom">
      <div class="footer-copy">© <span id="current-year"></span> ИП Варгич В.Л.</div>

      <div class="footer-links">
        <a href="/admin-login">Админ-панель</a>
        <a href="/policy">Политика конфиденциальности</a>
        <a href="/terms">Пользовательское соглашение</a>
      </div>

      <div class="footer-socials">
        <a href="https://vk.com/metizelektrod" target="_blank" class="social-btn"
          style="text-decoration: none; color: inherit;">VK</a>
        <a href="https://t.me/metizelektrod" target="_blank" class="social-btn"
          style="text-decoration: none; color: inherit;">TG</a>
      </div>
    </div>
  </footer>

  <script type="module" src="/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const mainContent = document.getElementById('main-content');
      if (mainContent) {
        mainContent.classList.remove('loading');
      }
    });
    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>
