<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог — Метиз Электрод</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.14.0/css/all.css" />
  <meta name="format-detection" content="telephone=no">
</head>

<body>

  <!-- ШАПКА -->
  <header class="shop-header">
    <div class="shop-header__container">
      <a href="/" class="shop-logo">Метиз<span class="text-brand">Электрод</span></a>

      <a href="tel:+78445790099" class="header-phone-btn header-phone-mobile">
        <i class="fas fa-phone-alt"></i>
        <span>+7 (84457) 9-00-99</span>
      </a>

      <button class="burger-btn" id="burgerBtn" aria-label="Открыть меню">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="shop-nav" id="shopNav">
        <a href="/">Главная</a>
        <a href="/catalog" class="active">Каталог</a>
        <a href="/about">О нас</a>
        <a href="/contacts">Контакты</a>
      </nav>

      <div class="shop-header__actions">
        <a href="tel:+78445790099" class="header-phone-btn header-phone-desktop">
          <i class="fas fa-phone-alt" style="margin-right: 6px;"></i><span>+7 (84457) 9-00-99</span>
        </a>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="catalog-layout">
      <!-- ЛЕВАЯ ПАНЕЛЬ ФИЛЬТРОВ -->
     <div class="catalog-filter-bar">
  <div class="catalog-search-container">
    <input type="text" id="searchInput" placeholder="Поиск по названию..." class="search-input-top">
  </div>
  <div class="catalog-category-container">
    <!-- Сюда будет вставлен выпадающий список категорий -->
  </div>
  <div class="catalog-sort-container">
    <!-- Сюда будет вставлен выпадающий список сортировки -->
  </div>
</div>

      <!-- КОНТЕНТ КАТАЛОГА -->
      <div class="catalog-content">
        <div class="mobile-filter-bar">
          <button class="hero-btn mobile-filter-btn" onclick="toggleSidebar()">
            <i class="fas fa-sliders-h"></i> Фильтры и категории
          </button>
        </div>

        <!-- Сетка товаров -->
        <div class="products-grid" id="productsGrid">
          <div class="skeleton-card"><div class="skeleton-box" style="aspect-ratio: 1/1; width: 100%;"></div></div>
          <div class="skeleton-card"><div class="skeleton-box" style="aspect-ratio: 1/1; width: 100%;"></div></div>
          <div class="skeleton-card"><div class="skeleton-box" style="aspect-ratio: 1/1; width: 100%;"></div></div>
          <div class="skeleton-card"><div class="skeleton-box" style="aspect-ratio: 1/1; width: 100%;"></div></div>
        </div>

        <!-- Пагинация -->
        <div class="pagination-container" id="paginationContainer">
          <button class="pagination-btn" id="prevPageBtn" disabled>← Назад</button>
          <span id="pageInfo">Страница 1 из 1</span>
          <button class="pagination-btn" id="nextPageBtn">Вперёд →</button>
        </div>
      </div>
    </section>
  </main>

  <!-- ФУТЕР -->
  <footer style="border-top:1px solid var(--border-color);">
    <div class="footer-bottom">
      <div class="footer-copy">© <span id="current-year"></span> ИП Варгич В.Л.</div>

      <div class="footer-links">
        <a href="/admin-login">Админ-панель</a>
        <a href="/policy">Политика конфиденциальности</a>
        <a href="/terms">Пользовательское соглашение</a>
      </div>

      <div class="footer-socials">
        <a href="https://vk.com/metizelektrod" target="_blank" class="social-btn">VK</a>
        <a href="https://t.me/metizelektrod" target="_blank" class="social-btn">TG</a>
      </div>
    </div>
  </footer>

  <!-- ИСПРАВЛЕННЫЙ ПУТЬ К СКРИПТУ -->
  <script type="module" src="./js/app.js"></script>
</body>

</html>
